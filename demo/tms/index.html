<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Haulr TMS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%232c6a5a%22/%3E%3Ctext x=%2216%22 y=%2222%22 font-size=%2218%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22Arial%22%3EH%3C/text%3E%3C/svg%3E">
<style>
/* Haulr TMS: a fictional trucking TMS used as a test fixture for Scopos. Single file, no external resources.
   Every commit button POSTs to /api/tms/write; opening forms, tabs, menus, drawers and popovers never hits the network. */
:root { --bg:#f5f6f8; --panel:#fff; --line:#e2e5ea; --line-2:#eef0f3; --text:#1c2230; --muted:#667085; --faint:#98a0ae;
  --brand:#2c6a5a; --brand-2:#e5f1ed; --side:#16211e; --side-2:#22302c; --side-text:#c5d0cc;
  --blue:#2a5fc4; --blue-bg:#e7eefc; --amber:#946000; --amber-bg:#fcf1d9; --green:#20724a; --green-bg:#e1f3e9;
  --red:#b3342c; --red-bg:#fbe6e4; --violet:#6847b3; --violet-bg:#eee9fb; --gray-bg:#eef0f3;
  --shadow:0 10px 30px rgba(18,26,42,.14); color-scheme: light; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color: var(--text); background: var(--bg); }
a { color: var(--blue); text-decoration: none; } a:hover { text-decoration: underline; }
h1 { font-size: 21px; margin: 0; letter-spacing: -.01em; } h2 { font-size: 15px; margin: 0 0 10px; } h3 { font-size: 14px; margin: 0 0 6px; }
.muted { color: var(--muted); } .sm { font-size: 12px; } .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.grow { flex: 1; }
/* shell */
.app { display: grid; grid-template-columns: 236px 1fr; grid-template-rows: 56px 1fr; height: 100vh; }
.app.collapsed { grid-template-columns: 64px 1fr; }
.app.collapsed .lbl, .app.collapsed .nav-h, .app.collapsed .brand-name, .app.collapsed .chev { display: none; }
.sidebar { grid-row: 1 / 3; background: var(--side); color: var(--side-text); display: flex; flex-direction: column; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 18px; font-weight: 700; color: #fff; font-size: 16px; }
.logo { width: 28px; height: 28px; border-radius: 7px; background: linear-gradient(135deg,#3f9a80,#2c6a5a); display: grid; place-items: center; font-size: 15px; color: #fff; flex: none; }
nav.main-nav { padding: 6px 10px; flex: 1; }
.nav-h { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #7f8e89; padding: 14px 10px 6px; }
.nav-link, .nav-group { display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 10px; border-radius: 7px; color: var(--side-text); background: none; border: 0; font: inherit; cursor: pointer; text-align: left; }
.nav-link:hover, .nav-group:hover { background: var(--side-2); color: #fff; text-decoration: none; }
.nav-link[aria-current="page"] { background: #2b3f39; color: #fff; font-weight: 600; }
.nav-sub { list-style: none; margin: 2px 0 4px; padding: 0 0 0 28px; }
.nav-sub .nav-link { padding: 6px 10px; }
.nav-group .chev { margin-left: auto; transition: transform .15s; } .nav-group[aria-expanded="true"] .chev { transform: rotate(180deg); }
.side-foot { padding: 10px; border-top: 1px solid var(--side-2); display: flex; flex-direction: column; gap: 4px; }
.side-foot .icon-btn { color: var(--side-text); align-self: flex-start; }
.topbar { display: flex; align-items: center; gap: 12px; padding: 0 20px; background: var(--panel); border-bottom: 1px solid var(--line); }
.gsearch { position: relative; flex: 1; max-width: 520px; }
.gsearch input { width: 100%; height: 36px; padding: 0 12px 0 36px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); font: inherit; }
.gsearch .ic { position: absolute; left: 11px; top: 9px; color: var(--faint); }
.gsearch [role=listbox] { position: absolute; top: 40px; left: 0; right: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); padding: 4px; z-index: 30; }
.gsearch [role=option] { display: flex; justify-content: space-between; padding: 7px 10px; border-radius: 6px; color: var(--text); }
.gsearch [role=option]:hover, .gsearch [role=option][aria-selected=true] { background: var(--bg); text-decoration: none; }
.top-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.user-btn { display: flex; align-items: center; gap: 8px; border: 0; background: none; font: inherit; cursor: pointer; padding: 4px 6px; border-radius: 8px; color: var(--text); }
.user-btn:hover { background: var(--bg); }
.avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--brand-2); color: var(--brand); display: grid; place-items: center; font-weight: 700; font-size: 12px; }
main { overflow-y: auto; padding: 22px 28px 60px; min-width: 0; }
/* controls */
.btn { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 13px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel); color: var(--text); cursor: pointer; font: inherit; font-weight: 500; white-space: nowrap; }
.btn:hover { background: var(--bg); text-decoration: none; }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; } .btn.primary:hover { background: #245a4c; }
.btn.danger { background: var(--red); border-color: var(--red); color: #fff; }
.btn:disabled, .btn[aria-busy=true] { opacity: .6; cursor: progress; }
.btn.sm { height: 28px; padding: 0 10px; font-size: 13px; }
.icon-btn { position: relative; display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 7px; border: 0; background: none; color: var(--muted); cursor: pointer; font: inherit; font-size: 18px; line-height: 1; }
.icon-btn:hover { background: var(--bg); color: var(--text); }
.icon-btn .count { position: absolute; top: 3px; right: 3px; min-width: 16px; height: 16px; border-radius: 8px; background: var(--red); color: #fff; font-size: 10px; font-weight: 700; display: grid; place-items: center; padding: 0 4px; }
.ic { flex: none; }
input, select, textarea { font: inherit; color: var(--text); }
.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; min-width: 0; }
.field label, .lbl-text { font-size: 13px; font-weight: 500; color: #3a4252; }
.field input:not([type=checkbox]):not([type=radio]), .field select, .field textarea, .ctl { height: 34px; border: 1px solid #d3d8df; border-radius: 7px; padding: 0 10px; background: #fff; width: 100%; }
.field textarea { height: auto; min-height: 76px; padding: 8px 10px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus, .ctl:focus, .cselect-btn:focus { outline: 2px solid #9cc9bb; outline-offset: 0; border-color: var(--brand); }
.field .err { color: var(--red); font-size: 12px; } [aria-invalid=true] { border-color: var(--red) !important; }
.field.check { flex-direction: row; align-items: center; gap: 8px; } .field.check label { font-weight: 400; }
.req { color: var(--red); } .hint { color: var(--muted); font-size: 12px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; } .grid3 { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 0 14px; }
/* page */
.page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
.page-head p { margin: 4px 0 0; }
.actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.crumbs { font-size: 13px; color: var(--muted); margin-bottom: 8px; } .crumbs a { color: var(--muted); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
.card.flush { padding: 0; overflow: hidden; }
.card-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--line-2); }
.card-head h2 { margin: 0; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-bottom: 16px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
.kpi-label { color: var(--muted); font-size: 12.5px; } .kpi-value { font-size: 22px; font-weight: 650; margin-top: 2px; font-variant-numeric: tabular-nums; } .kpi-sub { font-size: 12px; color: var(--muted); }
.cols { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; align-items: start; }
.facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px 20px; margin: 0; }
.facts dt { color: var(--muted); font-size: 12px; } .facts dd { margin: 2px 0 0; font-weight: 500; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; background: var(--gray-bg); color: #4a5263; }
.badge.blue { background: var(--blue-bg); color: var(--blue); } .badge.amber { background: var(--amber-bg); color: var(--amber); } .badge.green { background: var(--green-bg); color: var(--green); }
.badge.red { background: var(--red-bg); color: var(--red); } .badge.violet { background: var(--violet-bg); color: var(--violet); }
/* tables */
.table-wrap { overflow: auto; } .table-wrap.scroll { max-height: calc(100vh - 330px); min-height: 280px; }
table { border-collapse: separate; border-spacing: 0; width: 100%; background: var(--panel); }
th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--line-2); vertical-align: top; }
th { font-size: 12px; font-weight: 600; color: var(--muted); background: #fafbfc; white-space: nowrap; }
thead th { position: sticky; top: 0; z-index: 2; }
tbody tr:hover td { background: #fafcfb; }
td.chk, th.chk { width: 36px; } td.act { width: 44px; text-align: right; padding: 4px 8px; }
.hide-miles .col-miles, .hide-rpm .col-rpm, .hide-truck .col-truck { display: none; }
.filters { display: flex; gap: 10px; align-items: flex-end; padding: 12px 16px; border-bottom: 1px solid var(--line-2); flex-wrap: wrap; }
.filters .field { margin: 0; } .filters .field input, .filters .field select { min-width: 160px; }
.pager { display: flex; align-items: center; gap: 10px; justify-content: flex-end; padding: 10px 16px; font-size: 13px; color: var(--muted); }
.pager select { height: 30px; border: 1px solid var(--line); border-radius: 6px; }
.bulk { padding: 8px 16px; background: var(--brand-2); color: var(--brand); font-size: 13px; font-weight: 500; }
/* tabs */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 16px; overflow-x: auto; overflow-y: hidden; }
.card > .tabs { margin: 0; padding: 0 12px; }
[role=tab] { border: 0; background: none; font: inherit; color: var(--muted); padding: 10px 12px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; font-weight: 500; }
[role=tab][aria-selected=true] { color: var(--brand); border-bottom-color: var(--brand); }
[role=tab] .n { display: inline-block; margin-left: 6px; padding: 0 7px; border-radius: 9px; background: var(--gray-bg); font-size: 11.5px; color: var(--muted); }
/* floating: menus, popovers, listbox */
#layer > * { position: fixed; z-index: 60; background: var(--panel); border: 1px solid var(--line); border-radius: 9px; box-shadow: var(--shadow); }
.menu { list-style: none; margin: 0; padding: 5px; min-width: 190px; }
.menu [role=menuitem] { display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 10px; border: 0; background: none; font: inherit; color: var(--text); border-radius: 6px; cursor: pointer; text-align: left; }
.menu [role=menuitem]:hover, .menu [role=menuitem]:focus { background: var(--bg); outline: none; text-decoration: none; }
.menu [role=menuitem].danger { color: var(--red); } .menu [aria-disabled=true] { color: var(--faint); cursor: not-allowed; }
.menu [role=separator] { height: 1px; background: var(--line-2); margin: 4px 0; }
.popover { width: 340px; padding: 0; } .popover .pop-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-bottom: 1px solid var(--line-2); }
.popover .pop-body { padding: 12px 14px; } .popover .pop-foot { padding: 10px 14px; border-top: 1px solid var(--line-2); display: flex; gap: 8px; justify-content: flex-end; }
.notif { list-style: none; margin: 0; padding: 0; } .notif li { padding: 10px 14px; border-bottom: 1px solid var(--line-2); font-size: 13px; } .notif li.unread { background: #f6faf8; } .notif li:last-child { border: 0; }
.cselect { position: relative; }
.cselect-btn { display: flex; align-items: center; justify-content: space-between; width: 100%; height: 34px; border: 1px solid #d3d8df; border-radius: 7px; padding: 0 10px; background: #fff; font: inherit; cursor: pointer; text-align: left; }
.cselect [role=listbox] { position: absolute; top: 38px; left: 0; right: 0; margin: 0; padding: 4px; list-style: none; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); z-index: 20; }
.cselect [role=option] { padding: 7px 10px; border-radius: 6px; cursor: pointer; } .cselect [role=option]:hover { background: var(--bg); } .cselect [role=option][aria-selected=true] { font-weight: 600; color: var(--brand); }
/* dialogs and drawer */
dialog.modal { border: 0; padding: 0; border-radius: 12px; box-shadow: var(--shadow); width: min(520px, calc(100vw - 32px)); color: var(--text); }
dialog.modal::backdrop { background: rgba(16,22,34,.42); }
.overlay { position: fixed; inset: 0; background: rgba(16,22,34,.42); display: grid; place-items: center; z-index: 50; padding: 16px; }
.overlay > .modal { background: var(--panel); border-radius: 12px; box-shadow: var(--shadow); width: min(520px, 100%); max-height: calc(100vh - 32px); overflow: auto; }
.modal.lg { width: min(680px, calc(100vw - 32px)); }
.modal-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--line-2); }
.modal-head h2 { margin: 0; font-size: 16px; }
.modal-body { padding: 16px 18px 6px; } .modal-body > p:first-child { margin-top: 0; }
.modal-foot { display: flex; gap: 8px; justify-content: flex-end; align-items: center; padding: 12px 18px; border-top: 1px solid var(--line-2); background: #fafbfc; }
.drawer-wrap { position: fixed; inset: 0; z-index: 50; }
.drawer-backdrop { position: absolute; inset: 0; background: rgba(16,22,34,.32); }
.drawer { position: absolute; top: 0; right: 0; bottom: 0; width: min(440px, 100vw); background: var(--panel); box-shadow: var(--shadow); display: flex; flex-direction: column; animation: slide .18s ease-out; }
.drawer form { display: flex; flex-direction: column; height: 100%; } .drawer .modal-body { flex: 1; overflow: auto; }
@keyframes slide { from { transform: translateX(40px); opacity: .4; } }
.steps { display: flex; gap: 8px; list-style: none; padding: 0; margin: 0 0 14px; font-size: 13px; color: var(--muted); }
.steps li { flex: 1; padding: 6px 8px; border-radius: 6px; background: var(--bg); } .steps li[aria-current=step] { background: var(--brand-2); color: var(--brand); font-weight: 600; }
.plans { display: grid; gap: 8px; } .plans label { display: flex; gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; cursor: pointer; }
/* misc */
.toasts { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 100; }
.toast { display: flex; align-items: center; gap: 12px; background: #1f2a27; color: #fff; padding: 10px 10px 10px 14px; border-radius: 9px; box-shadow: var(--shadow); min-width: 300px; }
.toast.error { background: #8f2620; } .toast .icon-btn { color: #fff; width: 26px; height: 26px; margin-left: auto; font-size: 15px; }
.stop-box { border: 1px solid var(--line); border-radius: 9px; padding: 12px 14px 2px; margin-bottom: 12px; }
fieldset { border: 0; padding: 0; margin: 0; } legend { font-weight: 600; font-size: 15px; margin-bottom: 10px; padding: 0; }
.form-section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px 6px; margin-bottom: 14px; }
.form-foot { display: flex; justify-content: flex-end; gap: 8px; position: sticky; bottom: -60px; padding: 12px 0; background: var(--bg); }
.err-summary { background: var(--red-bg); color: var(--red); border-radius: 8px; padding: 10px 14px; margin-bottom: 12px; }
.route { display: flex; align-items: center; gap: 18px; } .route .arrow { color: var(--faint); font-size: 20px; } .route b { display: block; font-size: 15px; }
.timeline { list-style: none; margin: 0; padding: 0; } .timeline li { padding: 8px 0 8px 18px; border-left: 2px solid var(--line); position: relative; }
.timeline li::before { content: ""; position: absolute; left: -6px; top: 13px; width: 10px; height: 10px; border-radius: 50%; background: var(--brand); }
.bars { display: flex; align-items: flex-end; gap: 10px; height: 150px; padding-top: 8px; } .bars div { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: var(--muted); }
.bars span { width: 100%; background: #8fc3b2; border-radius: 4px 4px 0 0; } .bars div:last-child span { background: var(--brand); }
.alerts { list-style: none; margin: 0; padding: 0; } .alerts li { padding: 9px 0; border-bottom: 1px solid var(--line-2); font-size: 13px; } .alerts li:last-child { border: 0; }
.board { table-layout: fixed; } .board td, .board th { border-right: 1px solid var(--line-2); padding: 6px; } .board th:first-child, .board td:first-child { width: 170px; }
.board th.today { color: var(--brand); background: var(--brand-2); }
.chip { display: block; width: 100%; margin-bottom: 4px; border: 0; border-radius: 6px; padding: 4px 6px; font: inherit; font-size: 12px; text-align: left; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip.dispatched { background: var(--blue-bg); color: var(--blue); } .chip.in_transit { background: var(--amber-bg); color: var(--amber); } .chip.delivered, .chip.invoiced { background: var(--green-bg); color: var(--green); } .chip.available { background: var(--gray-bg); color: #4a5263; border: 1px dashed #b9c0cb; }
.chip.cont { opacity: .7; }
.int-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.int-cards .card { display: flex; flex-direction: column; gap: 8px; margin: 0; } .int-cards .card p { margin: 0; color: var(--muted); font-size: 13px; flex: 1; }
.report-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin-bottom: 16px; }
.report-cards button { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; font: inherit; cursor: pointer; }
.report-cards button[aria-pressed=true] { border-color: var(--brand); box-shadow: 0 0 0 2px var(--brand-2); }
.report-cards b { display: block; margin-bottom: 4px; } .report-cards span { color: var(--muted); font-size: 12.5px; }
.login { min-height: 100vh; display: grid; place-items: center; background: linear-gradient(160deg, #eaf3f0, #f5f6f8); }
.login .card { width: 360px; padding: 26px; } .login .brand { color: var(--text); padding: 0; height: auto; margin-bottom: 18px; }
@media (max-width: 900px) { .cols, .grid3 { grid-template-columns: 1fr; } .app { grid-template-columns: 64px 1fr; } .app .lbl, .app .nav-h, .app .brand-name, .app .chev { display: none; } }
</style>
</head>
<body>
<div id="app" class="app">
  <aside class="sidebar" aria-label="Sidebar">
    <div class="brand"><span class="logo" aria-hidden="true">H</span><span class="brand-name">Haulr TMS</span></div>
    <nav class="main-nav" id="nav" aria-label="Main navigation"></nav>
    <div class="side-foot" id="side-foot"></div>
  </aside>
  <header class="topbar">
    <div class="gsearch">
      <svg class="ic" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM21 21l-4.3-4.3"/></svg>
      <input id="gsearch" type="search" role="combobox" aria-label="Search loads, drivers, trucks and customers" aria-expanded="false" aria-controls="gsearch-list" aria-autocomplete="list" autocomplete="off" placeholder="Search loads, drivers, trucks, customers…">
      <div id="gsearch-list" role="listbox" aria-label="Search results" hidden></div>
    </div>
    <div class="top-actions">
      <button type="button" class="btn primary" id="new-btn" aria-haspopup="menu" aria-expanded="false" data-act="menu" data-menu="new">+ New <span aria-hidden="true">▾</span></button>
      <button type="button" class="icon-btn" id="bell" aria-label="Notifications" aria-haspopup="dialog" aria-expanded="false" data-act="bell"></button>
      <div class="icon-btn" role="button" tabindex="0" title="Help" data-act="help" aria-haspopup="dialog" aria-expanded="false">?</div>
      <button type="button" class="user-btn" id="user-btn" aria-haspopup="menu" aria-expanded="false" data-act="menu" data-menu="user"><span class="avatar" aria-hidden="true">DW</span><span>Dana Whitfield</span><span aria-hidden="true" class="muted">▾</span></button>
    </div>
  </header>
  <main id="main"></main>
</div>
<div id="login" hidden></div>
<div id="layer"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<script>
(() => {
'use strict';
// ================= utilities =================
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

async function commit(btn, action, data, apply, okMsg) {

  try { await write(action, data); }
  catch (e) { toast(`Couldn't complete the action. ${e && e.message && !/fetch/i.test(e.message) ? e.message : 'Check your connection and try again.'}`, 'error'); return false; }
